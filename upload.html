<!DOCTYPE html>
<html lang="id">

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#003087">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Unggah Bukti Pembayaran</title>
    
    <!-- Google Icons & Fonts -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Tailwind CSS (Minified CDN) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
    
    <style>
        /* Custom Colors & Mobile Optimization */
        :root {
            --primary-color: #003087;
            --primary-hover: #00205b;
        }
        .bg-primary { background-color: var(--primary-color) !important; }
        .text-primary { color: var(--primary-color) !important; }
        .hover\:bg-primaryHover:hover { background-color: var(--primary-hover) !important; }
        .focus\:ring-primary:focus { --tw-ring-color: var(--primary-color) !important; }
        
        body {
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        .input-group { position: relative; margin-bottom: 1.5rem; }
        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            outline: none;
            transition: all 0.2s;
            font-size: 0.875rem;
        }
        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 48, 135, 0.1);
        }
        .input-group label {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 0.875rem;
            transition: all 0.2s;
            pointer-events: none;
            background: white;
            padding: 0 4px;
        }
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: 0;
            font-size: 0.75rem;
            color: var(--primary-color);
            font-weight: 600;
        }
        .input-group input[readonly] { background-color: #f9fafb; cursor: not-allowed; }

        /* Modern Drag & Drop Zone */
        .file-drop-area {
            border: 2px dashed #9ca3af;
            border-radius: 0.75rem;
            padding: 1.5rem 1rem;
            text-align: center;
            background: #f9fafb;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }
        .file-drop-area:hover, .file-drop-area.dragover {
            border-color: var(--primary-color);
            background: #eff6ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 48, 135, 0.1);
        }
        .file-drop-area input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            opacity: 0;
            cursor: pointer;
        }
        .file-icon {
            font-size: 2.5rem;
            color: #9ca3af;
            margin-bottom: 0.5rem;
            transition: color 0.3s;
        }
        .file-drop-area:hover .file-icon { color: var(--primary-color); }

        @supports (padding: env(safe-area-inset-top)) {
            body {
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
</head>

<body class="text-gray-800 font-sans min-h-screen flex flex-col">
    <div class="w-full max-w-xl mx-auto p-4 box-border" id="app">
        <div class="bg-white rounded-xl shadow-lg p-6 my-2 min-h-[calc(100vh-40px)] pt-[calc(20px+env(safe-area-inset-top))] border-t-4 border-primary">
            
            <div class="flex justify-center mb-4">
                <img src="https://i.imgur.com/VDy2lSE.png" alt="Logo UMSU" class="w-16 h-auto" loading="lazy" decoding="async">
            </div>

            <div class="text-center text-primary mb-6">
                <h1 class="text-xl font-extrabold tracking-tight">Unggah Bukti Pembayaran</h1>
                <h2 class="text-md font-semibold opacity-90">Remedial Semester Genap</h2>
                <p class="text-xs mt-1 text-gray-500 font-medium">Fakultas Kedokteran & Ilmu Kesehatan UMSU</p>
            </div>

            <form id="uploadForm" onsubmit="event.preventDefault();">
                
                <div class="input-group" style="margin-bottom: 0.25rem;">
                    <input type="text" id="npm" placeholder=" " pattern="[0-9]{10}" required inputmode="numeric" autocomplete="off" maxlength="10">
                    <label for="npm">NPM (10 Digit Angka) <span class="text-red-500">*</span></label>
                </div>
                <div style="min-height: 1.25rem; margin-bottom: 0.75rem;" class="px-1">
                    <small id="checkingStatus" class="block text-xs font-semibold text-blue-500"></small>
                </div>

                <div class="input-group">
                    <input type="text" id="namaLengkap" placeholder=" " readonly required>
                    <label for="namaLengkap">Nama Lengkap</label>
                </div>

                <div class="input-group mt-2">
                    <input type="text" id="totalSks" placeholder=" " readonly required>
                    <label for="totalSks">Total SKS Diambil</label>
                </div>

                <!-- Bukti Pendaftaran (ACC Prodi) -->
                <div class="mb-5">
                    <span class="block text-sm font-bold text-gray-700 mb-2">Bukti Pendaftaran (ACC Prodi) <span class="text-red-500">*</span></span>
                    <div class="file-drop-area" id="dropAreaDaftar">
                        <i class="material-icons file-icon">file_upload</i>
                        <p class="text-sm text-gray-600 font-bold" id="fileNameDaftar">Ketuk untuk memilih file</p>
                        <p class="text-xs text-gray-400 mt-1">Format JPG/PNG/PDF (Maks 2MB)</p>
                        <input type="file" id="buktiPendaftaran" accept="image/jpeg,image/png,image/jpg,application/pdf" required>
                    </div>
                    <small id="daftarFeedback" class="block mt-1 text-xs text-red-500 font-medium"></small>
                </div>

                <!-- Bukti Pembayaran -->
                <div class="mb-6">
                    <span class="block text-sm font-bold text-gray-700 mb-2">Bukti Pembayaran (Transfer/Bank) <span class="text-red-500">*</span></span>
                    <div class="file-drop-area" id="dropAreaBayar">
                        <i class="material-icons file-icon">receipt_long</i>
                        <p class="text-sm text-gray-600 font-bold" id="fileNameBayar">Ketuk untuk memilih file</p>
                        <p class="text-xs text-gray-400 mt-1">Format JPG/PNG/PDF (Maks 2MB)</p>
                        <input type="file" id="buktiPembayaran" accept="image/jpeg,image/png,image/jpg,application/pdf" required>
                    </div>
                    <small id="bayarFeedback" class="block mt-1 text-xs text-red-500 font-medium"></small>
                </div>

                <button id="submitUpload" type="button" disabled class="w-full bg-primary text-white font-bold py-3 px-4 rounded-lg shadow-lg opacity-50 cursor-not-allowed transition duration-300 flex justify-center items-center gap-2">
                    <span>Kirim Bukti Pembayaran</span>
                    <i class="material-icons text-sm">cloud_upload</i>
                </button>
                
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC (Client-Side Compression + Fast Submit) -->
    <script>
        let verifiedStudent = null;
        let lookupTimer = null;
        let blockedUploadMessage = '';
        
        const fileStore = { 
            daftarBase64: null, daftarName: '', daftarType: '',
            bayarBase64: null, bayarName: '', bayarType: ''
        };

        // Cek koneksi GAS
        if (typeof google === 'undefined') {
            Swal.fire({ icon: 'error', title: 'Akses Ditolak', text: 'Buka form ini melalui link resmi.' });
            document.getElementById('app').style.display = 'none';
        } else {
            google.script.run.withSuccessHandler(res => {
                if(res && !res.isAvailable) {
                    document.getElementById('app').style.display = 'none';
                    Swal.fire({icon: 'info', title: 'Tutup', text: res.message, allowOutsideClick: false}).then(()=>window.location.href='about:blank');
                }
            }).checkUploadFormAvailability();
        }

        // ==========================================
        // 1. AUTOCOMPRESSION & VALIDATION (SUPER FAST)
        // ==========================================
        function processFile(file, typeKey, feedbackId, nameLabelId) {
            const feedback = document.getElementById(feedbackId);
            const nameLabel = document.getElementById(nameLabelId);
            
            if(!file) return;
            
            // Validasi Ukuran (Max 2MB untuk PDF/Gambar sebelum dikompres)
            if(file.size > 2 * 1024 * 1024) {
                feedback.textContent = 'Ukuran file terlalu besar (Maks 2MB).';
                nameLabel.textContent = 'Ketuk untuk memilih file';
                fileStore[typeKey+'Base64'] = null;
                setSubmitVisibility(); return;
            }

            feedback.textContent = 'Memproses...';
            nameLabel.textContent = file.name;
            nameLabel.classList.add('text-primary');

            fileStore[typeKey+'Name'] = file.name;
            fileStore[typeKey+'Type'] = file.type;

            // Jika Gambar: Kompres Otomatis
            if(file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const MAX_WIDTH = 1000; // Agak lebih besar untuk dokumen struk
                        let width = img.width, height = img.height;
                        if (width > MAX_WIDTH) {
                            height = Math.round(height * (MAX_WIDTH / width));
                            width = MAX_WIDTH;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        fileStore[typeKey+'Base64'] = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                        fileStore[typeKey+'Type'] = 'image/jpeg'; // Paksa ke JPEG
                        fileStore[typeKey+'Name'] = file.name.replace(/\.[^/.]+$/, ".jpg");
                        
                        feedback.innerHTML = '<span class="text-green-600">✓ File siap</span>';
                        setSubmitVisibility();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            } 
            // Jika PDF: Langsung baca Base64
            else if (file.type === 'application/pdf') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    fileStore[typeKey+'Base64'] = e.target.result.split(',')[1];
                    feedback.innerHTML = '<span class="text-green-600">✓ PDF siap</span>';
                    setSubmitVisibility();
                };
                reader.readAsDataURL(file);
            } else {
                feedback.textContent = 'Format tidak didukung (Hanya JPG/PNG/PDF).';
                fileStore[typeKey+'Base64'] = null;
                setSubmitVisibility();
            }
        }

        document.getElementById('buktiPendaftaran').addEventListener('change', function(e) {
            processFile(e.target.files[0], 'daftar', 'daftarFeedback', 'fileNameDaftar');
        });

        document.getElementById('buktiPembayaran').addEventListener('change', function(e) {
            processFile(e.target.files[0], 'bayar', 'bayarFeedback', 'fileNameBayar');
        });

        // ==========================================
        // 2. FORM LOGIC & AUTOCOMPLETE
        // ==========================================
        function setSubmitVisibility() {
            const btn = document.getElementById('submitUpload');
            if(verifiedStudent && fileStore.daftarBase64 && fileStore.bayarBase64 && !blockedUploadMessage) {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.classList.add('hover:bg-primaryHover');
            } else {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.classList.remove('hover:bg-primaryHover');
            }
        }

        function clearStudentFields() {
            verifiedStudent = null; blockedUploadMessage = '';
            document.getElementById('namaLengkap').value = '';
            document.getElementById('totalSks').value = '';
            document.getElementById('checkingStatus').textContent = '';
            setSubmitVisibility();
        }

        function lookupNpm() {
            const npm = document.getElementById('npm').value.trim();
            if(npm.length !== 10) { clearStudentFields(); return; }
            
            document.getElementById('checkingStatus').textContent = 'Memeriksa data...';
            document.getElementById('checkingStatus').className = 'block mt-1 text-xs font-semibold text-blue-500';
            
            google.script.run
                .withSuccessHandler(res => {
                    if (res && res.status === 'closed') {
                        clearStudentFields();
                        Swal.fire({icon: 'info', title: 'Ditutup', text: res.message}).then(()=>location.reload());
                        return;
                    }
                    if (res && res.status === 'already_uploaded') {
                        clearStudentFields();
                        blockedUploadMessage = res.message;
                        document.getElementById('checkingStatus').textContent = '✗ ' + blockedUploadMessage;
                        document.getElementById('checkingStatus').className = 'block mt-1 text-xs font-semibold text-red-500';
                        Swal.fire({icon: 'warning', title: 'Perhatian', text: blockedUploadMessage});
                        return;
                    }
                    if (res && res.status === 'success' && res.data) {
                        verifiedStudent = res.data;
                        blockedUploadMessage = '';
                        document.getElementById('namaLengkap').value = res.data.namalengkap || '';
                        document.getElementById('totalSks').value = res.data.totalSks || '';
                        document.getElementById('checkingStatus').textContent = '✓ Data terverifikasi';
                        document.getElementById('checkingStatus').className = 'block mt-1 text-xs font-semibold text-green-600';
                        setSubmitVisibility();
                        return;
                    }
                    clearStudentFields();
                    const errorMessage = (res && res.message) ? res.message : 'Data tidak ditemukan/sedang diproses';
                    document.getElementById('checkingStatus').textContent = '✗ ' + errorMessage;
                    document.getElementById('checkingStatus').className = 'block mt-1 text-xs font-semibold text-red-500';
                    Swal.fire({icon: 'warning', title: 'Perhatian', text: errorMessage});
                })
                .withFailureHandler(err => {
                    clearStudentFields();
                    document.getElementById('checkingStatus').textContent = 'Error koneksi';
                })
                .getUploadStudentDataByNpm(npm);
        }

        document.getElementById('npm').addEventListener('input', function() {
            clearTimeout(lookupTimer);
            const val = this.value.trim();
            if(val.length === 10) lookupNpm();
            else lookupTimer = setTimeout(lookupNpm, 300);
        });

        // ==========================================
        // 3. FAST SUBMIT & UPLOAD
        // ==========================================
        document.getElementById('submitUpload').addEventListener('click', function() {
            if(!verifiedStudent || !fileStore.daftarBase64 || !fileStore.bayarBase64) return;

            Swal.fire({
                title: 'Mengirim Berkas...',
                text: 'Proses kompresi selesai, sedang mengunggah...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            // Upload 2 file berbarengan secara paralel (asinkron)
            Promise.all([
                new Promise((res, rej) => google.script.run.withSuccessHandler(r => r.status==='success'?res(r.fileUrl):rej(r.message)).withFailureHandler(rej).uploadFileToDrive(fileStore.daftarBase64, fileStore.daftarName, fileStore.daftarType)),
                new Promise((res, rej) => google.script.run.withSuccessHandler(r => r.status==='success'?res(r.fileUrl):rej(r.message)).withFailureHandler(rej).uploadFileToDrive(fileStore.bayarBase64, fileStore.bayarName, fileStore.bayarType))
            ]).then(urls => {
                const payload = {
                    npm: document.getElementById('npm').value.trim(),
                    namalengkap: document.getElementById('namaLengkap').value,
                    totalSks: document.getElementById('totalSks').value,
                    buktiPendaftaranUrl: urls[0],
                    buktiPembayaranUrl: urls[1]
                };
                
                google.script.run
                    .withSuccessHandler(res => {
                        if(res.status === 'success') {
                            Swal.fire({icon: 'success', title: 'Berhasil', text: res.message}).then(() => location.reload());
                        } else {
                            Swal.fire({icon: 'error', title: 'Gagal', text: res.message});
                        }
                    })
                    .withFailureHandler(err => Swal.fire({icon: 'error', title: 'Gagal Menyimpan', text: String(err)}))
                    .submitUploadPembayaran(payload);
            }).catch(err => {
                Swal.fire({icon: 'error', title: 'Gagal Unggah', text: String(err)});
            });
        });
    </script>
</body>
</html>
